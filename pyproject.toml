[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whiflash"
version = "0.0.1"
description = "WhiFlash: Accelerating Speculative Decoding with Token-Level Cross-Paradigm Routing"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.6.1",
    "huggingface-hub>=0.36.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "ninja>=1.13.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tokenizers>=0.22.2",
    "torch>=2.9.1",
    "tqdm>=4.67.3",
    "transformers==4.57.1",
]


[project.scripts]

[dependency-groups]
dev = [
    "mdformat",
    "black",
    "isort",
    "pre-commit>=4.6.0",
    "tensorboard>=2.20.0",
]

[project.urls]
Homepage = "https://samsunglabs.github.io/WhiFlash/"
Repository = "https://github.com/SamsungLabs/WhiFlash"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.setuptools.packages.find]
exclude = ["assets*", "configs*", "scripts*", "docs*"]

[tool.wheel]
exclude = ["assets*", "configs*", "scripts*", "docs*"]
